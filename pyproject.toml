[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lswifi"
dynamic = ["version", "optional-dependencies"]
description = "a CLI-centric Wi-Fi scanning tool for Windows"
readme = "README-PYPI.md"
requires-python = ">=3.13"
license = "BSD-3-Clause"
authors = [{ name = "Josh Schmelzle", email = "josh@joshschmelzle.com" }]
keywords = [
    "lswifi",
    "scanner",
    "wireless",
    "wifi",
    "802.11",
    "wlan",
    "rlan",
    "native wifi",
    "wlanapi",
]
classifiers = [
    "Natural Language :: English",
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Topic :: Utilities",
    "Topic :: System :: Networking",
    "Topic :: System :: Networking :: Monitoring",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
]

[project.urls]
Homepage = "https://github.com/joshschmelzle/lswifi"

[project.scripts]
lswifi = "lswifi.__main__:main"

[tool.setuptools.packages.find]
include = ["lswifi*"]
exclude = ["tests*", "test*"]

[tool.setuptools.dynamic]
version = { attr = "lswifi.__version__.__version__" }

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = ["requirements/dev.txt"] }
macos = { file = ["requirements/macos.txt"] }

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [".tox"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E401",   # multiple imports on one line
]

[tool.ruff.lint.isort]
known-first-party = ["lswifi"]